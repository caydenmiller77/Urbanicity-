as":"2026 Unpopulated (Type 10) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 10: Unpopulated. These are areas with no Esri current year residential population that may exist inside or outside of both a Core Based Statistical Area or city boundaries. Daytime population may still be present within these territories. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"URBANICITYUPOP09_P":{"type":"number","alias":"2026 Rural Remote (Type 9) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 9: Rural Remote population. These areas are distant non-metro rural areas, but with more than a two hour drive of an Urban Core. These areas may be in the periphery of Remote Town or outside city boundaries. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"URBANICITYUPOP08_P":{"type":"number","alias":"2026 Rural Countryside (Type 8) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 8: Rural Countryside population. These areas are non-metro rural areas outside of a Core Based Statistical Area, but within a two hour drive of an Urban Core. These areas may exist within the periphery of Small Town or outside city boundaries. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"URBANICITYUPOP07_P":{"type":"number","alias":"2026 Remote Town (Type 7) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 7: Remote Town population. These areas are distant non-metro centers within cities outside Core Based Statistical Areas with more than a two hour drive of an Urban Core, and a population of at least 1,000 people and meeting a minimum density of at least 400 persons per square mile or 50 percent Census urban population. These areas are the densest relative to the parent city to form the core of the town. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"URBANICITYUPOP06_P":{"type":"number","alias":"2026 Small Town (Type 6) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 6: Small Town population. Small Town are non-metro centers within cities outside of a Core Based Statistical Area but within a two hour drive of an Urban Core, with population of at least 1,000 people and meeting a minimuim density of at least 400 persons per square mile or 90 percent Census urban population. These areas are the densest relative to the parent city to form the core of the town. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. S<a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"URBANICITYUPOP05_P":{"type":"number","alias":"2026 Metro Landscape (Type 5) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 5: Metro Landscape population. These can be considered metro low density territories within a Core Based Statistical Area with density lower than 200 persons per square mile. These territories exist in the periphery of Urban Core, Urban Vicinity, Peripheral Community, or Suburb--both inside and outside city boundaries. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"URBANICITYUPOP04_P":{"type":"number","alias":"2026 Suburb (Type 4) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 4: Suburb population. These areas are located around a metro commuter belt and defined only within a Core Based Statistical Area. These areas meet minimum density requirement of 200 persons per square mile and exist in the periphery of Urban Core, Urban Vicinity, or Peripheral Community--both inside and outside city boundaries. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"URBANICITYUPOP03_P":{"type":"number","alias":"2026 Peripheral Community (Type 3) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 3: Peripheral Community population. These areas represent the exurban metro core defined within cities with population between 2,000 and 75,000 on the outskirts larger Core Based Statistical Areas that meet a minimum density of at least 400 persons per square mile or 90 percent Census urban population. Areas assigned to Peripheral Community are the densest relative to the parent city to form the core of the community. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"URBANICITYUPOP02_P":{"type":"number","alias":"2026 Urban Vicinity (Type 2) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 2: Urban Vicinity population. These areas are the dense periphery of a metro city core and defined in a principal city and city with a population of 75,000 or more within a Core Based Statistical Area that meet a minimum density of at least 400 persons per square mile or 90 percent Census urban population. These areas exhibit high (albeit lower than Urban Core) housing or daytime population density relative to the parent city. These territories exist on the periphery of Urban Core. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"URBANICITYUPOP01_P":{"type":"number","alias":"2026 Urban Core (Type 1) Urbanicity Pop: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Urbanicity Type 1: Urban Core population. This is a dense metro city core defined in every principal city and city with a population of 75,000 or more within a Core Based Statistical Area that meet a minimum density of at least 400 persons per square mile or 90 percent Census urban population. These areas exhibit very high housing or daytime population density relative to the parent city. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"ATRISKAVGHHSZ_CY":{"type":"number","alias":"2026 Average Household Size","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of Average Household Size in the geographic area. The Average Household Size is calculated by dividing the number of persons living in households by the total number of households in the current year. Households include all the people who occupy a housing unit (such as a house or apartment) as their usual residence.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"URBANICITYURBNAME":{"type":"string","alias":"2026 Dominant Urbanicity Type Name","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Population Dominant Urbanicity Type Name in the geographic area. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"HEALTHMEDHINC_CY":{"type":"number","alias":"2026 Median Household Income","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of Median Household Income in the geographic area. Median Household Income is the amount that divides household income (annual income for all household earners age 15+) into two equal groups in a geographic area; half of the population will have income higher than the median and half will have lower income. If the median falls in the upper income interval of $500,000+, it is represented by the value of $500,001. Esri uses the U.S. Census definition of income; reference <a target='_blank' href='https://links.esri.com/esri-demographics/vocab'>Esri Essential Vocabulary</a>. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"ATRISKTOTPOP_CY":{"type":"number","alias":"2026 Total Population","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Total Population in the geographic area. Total Population includes population living in households, on active duty in the Armed Forces, and living in group quarters such as correctional facilities, skilled nursing facilities, juvenile facilities, college dorms, and military barracks. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"POPULATIONTOTALSPOPDENS_CY":{"type":"number","alias":"2026 Population Density","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Population Density (population per Square Mile) in the geographic area. Population density is computed by dividing the total population within the geographic area by the total land area, measured in square miles. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"KEYUSFACTSDIVINDX_CY":{"type":"number","alias":"2026 Diversity Index","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimated Diversity Index in the geographic area. Esri's Diversity Index summarizes racial and ethnic diversity, indicating the likelihood that two individuals, chosen at random from the same area, belong to the same race or ethnic group. The index ranges from 0 (no diversity) to 100 (highest diversity). An area's Diversity Index increases when the population includes more race/ethnic groups. <a target='_blank' href='https://links.esri.com/diversity-index'>read more</a> See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"WEALTHWLTHINDXCY":{"type":"number","alias":"2026 Wealth Index","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Wealth Index summarizes the wealth of a geographic area relative to the national level. Wealth is calculated from a number of indicators of affluence that include household income and average net worth. The concept of wealth is defined by more than just above-average household income; it also includes the value and abundance of material possessions and resources. Esri captures both aspects in its identification of the wealthiest areas in the country. The national index value is set to 100: values exceeding 100 represent above-average wealth while values below 100 represent below-average wealth. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"HOUSEHOLDTOTALSHAI_CY":{"type":"number","alias":"2026 Housing Affordability Index","vint inct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.URBANICITYUPOP08_P":{"id":"UPOP08_P","fullName":"urbanicity.UPOP08_P","alias":"2026 Rural Countryside (Type 8) Urbanicity Pop: Percent","fieldName":"URBANICITYUPOP08_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.URBANICITYUPOP08_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Urbanicity Type 8: Rural Countryside population. These areas are non-metro rural areas outside of a Core Based Statistical Area, but within a two hour drive of an Urban Core. These areas may exist within the periphery of Small Town or outside city boundaries. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.URBANICITYUPOP07_P":{"id":"UPOP07_P","fullName":"urbanicity.UPOP07_P","alias":"2026 Remote Town (Type 7) Urbanicity Pop: Percent","fieldName":"URBANICITYUPOP07_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.URBANICITYUPOP07_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Urbanicity Type 7: Remote Town population. These areas are distant non-metro centers within cities outside Core Based Statistical Areas with more than a two hour drive of an Urban Core, and a population of at least 1,000 people and meeting a minimum density of at least 400 persons per square mile or 50 percent Census urban population. These areas are the densest relative to the parent city to form the core of the town. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.URBANICITYUPOP06_P":{"id":"UPOP06_P","fullName":"urbanicity.UPOP06_P","alias":"2026 Small Town (Type 6) Urbanicity Pop: Percent","fieldName":"URBANICITYUPOP06_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.URBANICITYUPOP06_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Urbanicity Type 6: Small Town population. Small Town are non-metro centers within cities outside of a Core Based Statistical Area but within a two hour drive of an Urban Core, with population of at least 1,000 people and meeting a minimuim density of at least 400 persons per square mile or 90 percent Census urban population. These areas are the densest relative to the parent city to form the core of the town. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. S<a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.URBANICITYUPOP05_P":{"id":"UPOP05_P","fullName":"urbanicity.UPOP05_P","alias":"2026 Metro Landscape (Type 5) Urbanicity Pop: Percent","fieldName":"URBANICITYUPOP05_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.URBANICITYUPOP05_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Urbanicity Type 5: Metro Landscape population. These can be considered metro low density territories within a Core Based Statistical Area with density lower than 200 persons per square mile. These territories exist in the periphery of Urban Core, Urban Vicinity, Peripheral Community, or Suburb--both inside and outside city boundaries. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.URBANICITYUPOP04_P":{"id":"UPOP04_P","fullName":"urbanicity.UPOP04_P","alias":"2026 Suburb (Type 4) Urbanicity Pop: Percent","fieldName":"URBANICITYUPOP04_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.URBANICITYUPOP04_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Urbanicity Type 4: Suburb population. These areas are located around a metro commuter belt and defined only within a Core Based Statistical Area. These areas meet minimum density requirement of 200 persons per square mile and exist in the periphery of Urban Core, Urban Vicinity, or Peripheral Community--both inside and outside city boundaries. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.URBANICITYUPOP03_P":{"id":"UPOP03_P","fullName":"urbanicity.UPOP03_P","alias":"2026 Peripheral Community (Type 3) Urbanicity Pop: Percent","fieldName":"URBANICITYUPOP03_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.URBANICITYUPOP03_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Urbanicity Type 3: Peripheral Community population. These areas represent the exurban metro core defined within cities with population between 2,000 and 75,000 on the outskirts larger Core Based Statistical Areas that meet a minimum density of at least 400 persons per square mile or 90 percent Census urban population. Areas assigned to Peripheral Community are the densest relative to the parent city to form the core of the community. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.URBANICITYUPOP02_P":{"id":"UPOP02_P","fullName":"urbanicity.UPOP02_P","alias":"2026 Urban Vicinity (Type 2) Urbanicity Pop: Percent","fieldName":"URBANICITYUPOP02_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.URBANICITYUPOP02_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Urbanicity Type 2: Urban Vicinity population. These areas are the dense periphery of a metro city core and defined in a principal city and city with a population of 75,000 or more within a Core Based Statistical Area that meet a minimum density of at least 400 persons per square mile or 90 percent Census urban population. These areas exhibit high (albeit lower than Urban Core) housing or daytime population density relative to the parent city. These territories exist on the periphery of Urban Core. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.URBANICITYUPOP01_P":{"id":"UPOP01_P","fullName":"urbanicity.UPOP01_P","alias":"2026 Urban Core (Type 1) Urbanicity Pop: Percent","fieldName":"URBANICITYUPOP01_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.URBANICITYUPOP01_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Urbanicity Type 1: Urban Core population. This is a dense metro city core defined in every principal city and city with a population of 75,000 or more within a Core Based Statistical Area that meet a minimum density of at least 400 persons per square mile or 90 percent Census urban population. These areas exhibit very high housing or daytime population density relative to the parent city. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.ATRISKAVGHHSZ_CY":{"id":"AVGHHSZ_CY","fullName":"AtRisk.AVGHHSZ_CY","alias":"2026 Average Household Size","fieldName":"ATRISKAVGHHSZ_CY","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.ATRISKAVGHHSZ_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of Average Household Size in the geographic area. The Average Household Size is calculated by dividing the number of persons living in households by the total number of households in the current year. Households include all the people who occupy a housing unit (such as a house or apartment) as their usual residence.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.URBANICITYURBNAME":{"id":"URBNAME","fullName":"urbanicity.URBNAME","alias":"2026 Dominant Urbanicity Type Name","fieldName":"URBANICITYURBNAME","calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.URBANICITYURBNAME","type":"esriFieldTypeString","vintage":"2026","source":"Esri","definition":"Esri 2026 Population Dominant Urbanicity Type Name in the geographic area. Esri's Urbanicity Type database is a classification system that designates land into one of ten distinct categories that share characteristics typifying urbanicity including density, distance, and socioeconomic dependence to urban cores. <a target='_blank' href='https://links.esri.com/demographics/urbanicity'>Learn more about Urbanicity.</a>"},"dataCollectionsCalculator.HEALTHMEDHINC_CY":{"id":"MEDHINC_CY","fullName":"Health.MEDHINC_CY","alias":"2026 Median Household Income","fieldName":"HEALTHMEDHINC_CY","precision":1,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.HEALTHMEDHINC_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of Median Household Income in the geographic area. Median Household Income is the amount that divides household income (annual income for all household earners age 15+) into two equal groups in a geographic area; half of the population will have income higher than the median and half will have lower income. If the median falls in the upper income interval of $500,000+, it is represented by the value of $500,001. Esri uses the U.S. Census definition of income; reference <a target='_blank' href='https://links.esri.com/esri-demographics/vocab'>Esri Essential Vocabulary</a>. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.ATRISKTOTPOP_CY":{"id":"TOTPOP_CY","fullName":"AtRisk.TOTPOP_CY","alias":"2026 Total Population","fieldName":"ATRISKTOTPOP_CY","precision":1,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.ATRISKTOTPOP_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Total Population in the geographic area. Total Population includes population living in households, on active duty in the Armed Forces, and living in group quarters such as correctional facilities, skilled nursing facilities, juvenile facilities, college dorms, and military barracks. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.POPULATIONTOTALSPOPDENS_CY":{"id":"POPDENS_CY","fullName":"populationtotals.POPDENS_CY","alias":"2026 Population Density","fieldName":"POPULATIONTOTALSPOPDENS_CY","precision":1,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.POPULATIONTOTALSPOPDENS_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Population Density (population per Square Mile) in the geographic area. Population density is computed by dividing the total population within the geographic area by the total land area, measured in square miles. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.KEYUSFACTSDIVINDX_CY":{"id":"DIVINDX_CY","fullName":"KeyUSFacts.DIVINDX_CY","alias":"2026 Diversity Index","fieldName":"KEYUSFACTSDIVINDX_CY","precision":1,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.KEYUSFACTSDIVINDX_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimated Diversity Index in the geographic area. Esri's Diversity Index summarizes racial and ethnic diversity, indicating the likelihood that two individuals, chosen at random from the same area, belong to the same race or ethnic group. The index ranges from 0 (no diversity) to 100 (highest diversity). An area's Diversity Index increases when the population includes more race/ethnic groups. <a target='_blank' href='https://links.esri.com/diversity-index'>read more</a> See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.WEALTHWLTHINDXCY":{"id":"WLTHINDXCY","fullName":"Wealth.WLTHINDXCY","alias":"2026 Wealth Index","fieldName":"WEALTHWLTHINDXCY","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.WEALTHWLTHINDXCY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Wealth Index summarizes the wealth of a geographic area relative to the national level. Wealth is calculated from a number of indicators of affluence that include household income and average net worth. The concept of wealth is defined by more than just above-average household income; it also includes the value and abundance of material possessions and resources. Esri captures both aspects in its identification of the wealthiest areas in the country. The national index value is set to 100: values exceeding 100 represent above-average wealth while values below 100 represent below-average wealth. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.HOUSEHOLDTOTALSHAI_CY":{"id":"HAI_CY","fullName":"householdtotals.HAI_CY","alias":"2026 Housing Affordability Index","fieldN
